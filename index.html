<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Time Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 10px;
            font-size: 22px;
        }

        .date-range {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 13px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th, td {
            padding: 6px 4px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 13px;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        input[type="time"] {
            width: 100%;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 12px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        button.secondary {
            background-color: #64748b;
        }

        button.secondary:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Weekly Time Card</h1>
    <div class="date-range" id="dateRangeDisplay">Loading...</div>

    <form id="timeCardForm">
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Date</th>
                    <th>In</th>
                    <th>Out</th>
                    <th>Hours</th>
                </tr>
            </thead>
            <tbody id="timeCardBody">
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4" style="text-align: right; font-weight: 600;">Total:</td>
                    <td id="grandTotal" style="font-weight: 600;">0.00</td>
                </tr>
            </tfoot>
        </table>

        <div class="actions">
            <button type="button" class="secondary" onclick="clearData()">Clear</button>
            <button type="button" onclick="generatePDF()">Download PDF</button>
        </div>
    </form>
</div>

<script>
    try {
        const daysOfWeek = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

        function getDateRange() {
            const today = new Date();
            const currentDay = today.getDay();
            let diff = (currentDay + 1) % 7; 
            
            const startSaturday = new Date(today);
            startSaturday.setDate(today.getDate() - diff);
            startSaturday.setHours(0,0,0,0);

            const endFriday = new Date(startSaturday);
            endFriday.setDate(startSaturday.getDate() + 6);
            endFriday.setHours(23,59,59,999);

            return { startSaturday, endFriday };
        }

        const { startSaturday, endFriday } = getDateRange();
        const storageKey = `timecard_${startSaturday.toISOString().split('T')[0]}`;

        document.getElementById('dateRangeDisplay').innerText = 
            `Week: ${startSaturday.toLocaleDateString()} - ${endFriday.toLocaleDateString()}`;

        const tableBody = document.getElementById('timeCardBody');
        const dateCursor = new Date(startSaturday);
        
        let savedData = {};
        try {
            savedData = JSON.parse(localStorage.getItem(storageKey)) || {};
        } catch (e) {
            savedData = {};
        }

        for (let i = 0; i < 7; i++) {
            const rowDate = new Date(dateCursor);
            const dateStr = rowDate.toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' });
            const dayName = daysOfWeek[i];
            
            const dayData = savedData[dayName] || { clockIn: '', clockOut: '' };

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${dayName}</td>
                <td>${dateStr}</td>
                <td><input type="time" class="clock-in" value="${dayData.clockIn}" onchange="saveAndCalculate()"></td>
                <td><input type="time" class="clock-out" value="${dayData.clockOut}" onchange="saveAndCalculate()"></td>
                <td class="daily-total">0.00</td>
            `;
            tableBody.appendChild(row);
            dateCursor.setDate(dateCursor.getDate() + 1);
        }

        calculateTotal();

        function saveAndCalculate() {
            try {
                const rows = document.querySelectorAll('#timeCardBody tr');
                const dataToSave = {};

                rows.forEach(row => {
                    const day = row.cells[0].innerText;
                    const clockIn = row.querySelector('.clock-in').value;
                    const clockOut = row.querySelector('.clock-out').value;
                    dataToSave[day] = { clockIn, clockOut };
                });

                localStorage.setItem(storageKey, JSON.stringify(dataToSave));
            } catch (e) {}
            calculateTotal();
        }

        function calculateTotal() {
            const rows = document.querySelectorAll('#timeCardBody tr');
            let grandTotal = 0;

            rows.forEach(row => {
                const clockIn = row.querySelector('.clock-in').value;
                const clockOut = row.querySelector('.clock-out').value;
                const totalCell = row.querySelector('.daily-total');

                if (clockIn && clockOut) {
                    const start = new Date(`1970-01-01T${clockIn}:00Z`);
                    const end = new Date(`1970-01-01T${clockOut}:00Z`);
                    
                    let diff = (end - start) / (1000 * 60 * 60);
                    if (diff < 0) diff = 0; 
                    
                    totalCell.innerText = diff.toFixed(2);
                    grandTotal += diff;
                } else {
                    totalCell.innerText = '0.00';
                }
            });

            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
        }

        function clearData() {
            if (confirm("Clear all entered times for this week?")) {
                try {
                    localStorage.removeItem(storageKey);
                } catch (e) {}
                document.querySelectorAll('.clock-in, .clock-out').forEach(input => input.value = '');
                calculateTotal();
            }
        }

        function generatePDF() {
            calculateTotal(); 
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.setTextColor(30, 41, 59);
            doc.text("Weekly Time Card", 105, 15, { align: 'center' });

            doc.setFontSize(10);
            doc.setTextColor(37, 99, 235);
            doc.text(document.getElementById('dateRangeDisplay').innerText, 105, 22, { align: 'center' });

            const rows = [];
            const tableRows = document.querySelectorAll('#timeCardBody tr');
            
            tableRows.forEach(row => {
                const day = row.cells[0].innerText;
                const date = row.cells[1].innerText;
                const clockIn = row.querySelector('.clock-in').value || '--:--';
                const clockOut = row.querySelector('.clock-out').value || '--:--';
                const total = row.querySelector('.daily-total').innerText;
                
                rows.push([day, date, clockIn, clockOut, total]);
            });

            doc.autoTable({
                head: [['Day', 'Date', 'In', 'Out', 'Hours']],
                body: rows,
                startY: 28,
                theme: 'striped',
                headStyles: { fillColor: [37, 99, 235] },
                didDrawPage: function (data) {
                    const grandTotal = document.getElementById('grandTotal').innerText;
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'bold');
                    doc.text(`Grand Total Hours: ${grandTotal}`, 195, data.cursor.y + 8, { align: 'right' });
                }
            });

            const fileName = `Time_Card_${startSaturday.toLocaleDateString().replace(/\//g, '-')}.pdf`;
            doc.save(fileName);
        }
    } catch (err) {
        document.getElementById('dateRangeDisplay').innerText = "Error loading time card.";
    }
</script>

</body>
</html>
